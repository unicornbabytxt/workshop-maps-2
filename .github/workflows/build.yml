name: Build plugin

on:
  push:
    branches: [main]
    # Updating only the Browse tab's map list shouldn't ship a new build to everyone.
    paths-ignore: ['data/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get BakkesMod SDK
        run: git clone --depth 1 https://github.com/bakkesmodorg/BakkesModSDK.git BakkesModSDK

      - name: Configure
        run: cmake -S . -B build -A x64 -DWM_BUILD=${{ github.run_number }}

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: WorkshopMaps2
          path: build/Release/WorkshopMaps2.dll

      - name: Publish download
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Zip laid out the way BakkesMod installs plugins: plugins/WorkshopMaps2.dll
          New-Item -ItemType Directory -Force pkg/plugins | Out-Null
          Copy-Item build/Release/WorkshopMaps2.dll pkg/plugins/
          Compress-Archive -Path pkg/plugins -DestinationPath WorkshopMaps2.zip -Force
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest build/Release/WorkshopMaps2.dll WorkshopMaps2.zip --title "Workshop Maps 2.0 (build ${{ github.run_number }})" --notes "Download WorkshopMaps2.dll and follow the README to install."
          exit 0

      # The plugin's Update button reads these two files from the dist branch.
      - name: Publish to dist branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir dist
          cp build/Release/WorkshopMaps2.dll dist/
          echo "${{ github.run_number }}" > dist/version.txt
          cd dist
          git init -q -b dist
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dist
